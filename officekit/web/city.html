<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agents Office City</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #05060f;
    --panel: rgba(10, 12, 28, 0.82);
    --panel-border: rgba(120, 140, 255, 0.22);
    --text: #e6e8ff;
    --muted: #8a8fb3;
    --working: #22d3ee;
    --waiting: #ffb020;
    --blocked: #ff2bd6;
    --queued: #7c8cff;
    --idle: #3a8f88;
    --real: #3ddc84;
    --draft: #5aa9ff;
    --none: #8a8fa3;
    --danger: #ff5470;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); overflow: hidden; }
  #scene { position: fixed; inset: 0; }
  #scene canvas { display: block; }

  .panel {
    position: fixed; background: var(--panel); border: 1px solid var(--panel-border); border-radius: 14px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 0 0 1px rgba(0,0,0,.4), 0 10px 40px rgba(0,0,0,.45);
  }
  #hud { top: 16px; left: 16px; padding: 14px 16px; max-width: min(460px, calc(100vw - 32px)); }
  #hud h1 { margin: 0 0 2px; font-size: 18px; letter-spacing: .14em; text-transform: uppercase;
            text-shadow: 0 0 12px rgba(124,140,255,.8); }
  #hud .sub { font: 12px var(--mono); color: var(--muted); }
  #hud .sub .live { color: var(--real); }
  #hud .sub .stale { color: var(--danger); }
  #totals { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font: 12px var(--mono); }
  #totals b { font-weight: 600; }
  #legend { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 10px; font-size: 12px; color: var(--muted); }
  #legend span { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; box-shadow: 0 0 8px currentColor; background: currentColor; flex: none; }
  .pulse { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }

  #approvals { top: 16px; right: 16px; width: min(380px, calc(100vw - 32px)); max-height: calc(100vh - 32px);
               display: flex; flex-direction: column; }
  #approvals header, #agent header { padding: 14px 16px 10px; border-bottom: 1px solid var(--panel-border); }
  h2 { margin: 0; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; }
  #approvals h2 { color: var(--waiting); text-shadow: 0 0 10px rgba(255,176,32,.6); }
  .list { overflow-y: auto; padding: 8px 12px 12px; }
  .empty { color: var(--muted); font-size: 13px; padding: 8px 4px; }
  .card { border: 1px solid var(--panel-border); border-radius: 10px; padding: 10px 12px; margin-top: 8px;
          background: rgba(255,255,255,.02); }
  .card.clickable { cursor: pointer; }
  .card.clickable:hover { border-color: rgba(255,176,32,.6); }
  .card .row { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .id { font: 600 12px var(--mono); }
  .title { font-size: 14px; margin-top: 4px; }
  .meta { font: 11px var(--mono); color: var(--muted); margin-top: 4px; }
  .summary { font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.4; }
  .files { margin: 6px 0 0; padding: 0; list-style: none; font: 11px var(--mono); color: var(--muted); }
  .files li { overflow-wrap: anywhere; }
  .cmd { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
  .cmd code { flex: 1; font: 11.5px var(--mono); background: rgba(0,0,0,.45); border: 1px solid var(--panel-border);
              border-radius: 6px; padding: 5px 7px; overflow-x: auto; white-space: nowrap; color: var(--working); }
  .cmd button { font: 11px var(--mono); color: var(--text); background: rgba(124,140,255,.15); border: 1px solid var(--panel-border);
                border-radius: 6px; padding: 5px 8px; cursor: pointer; }
  .cmd button:hover { background: rgba(124,140,255,.3); }
  .pill { font: 600 10.5px var(--mono); letter-spacing: .04em; padding: 2px 7px; border-radius: 999px;
          border: 1px solid currentColor; white-space: nowrap; }

  #agent { left: 16px; bottom: 16px; width: min(440px, calc(100vw - 32px)); max-height: min(56vh, calc(100vh - 220px));
           display: flex; flex-direction: column; }
  #agent[hidden] { display: none; }
  #agent header { display: flex; align-items: flex-start; gap: 10px; }
  #agent header > div { flex: 1; min-width: 0; }
  #agent .name { font-size: 18px; font-weight: 700; }
  #agent .dept { font-size: 12px; color: var(--muted); margin-top: 2px; }
  #agent .facts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center; font: 11px var(--mono); color: var(--muted); }
  #close { background: none; border: 0; color: var(--muted); font-size: 22px; line-height: 1; cursor: pointer; padding: 0 2px; }
  #close:hover { color: var(--text); }
  .note { font: 11px var(--mono); color: var(--muted); margin-top: 6px; border-left: 2px solid var(--panel-border); padding-left: 8px; }

  #ticker { right: 16px; bottom: 16px; padding: 8px 14px; font: 11.5px var(--mono); color: var(--muted);
            max-width: min(560px, calc(100vw - 488px)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #ticker b { color: var(--text); font-weight: 600; }
  #hint { position: fixed; left: 50%; transform: translateX(-50%); top: 16px; font: 11px var(--mono); color: var(--muted);
          pointer-events: none; opacity: .8; }
  #error { left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 18px 20px; max-width: 420px; text-align: center; }
  #error[hidden] { display: none; }
  #error h2 { color: var(--danger); margin-bottom: 8px; }
  #error p { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.5; }

  @media (max-width: 900px) {
    #hint, #ticker { display: none; }
    #approvals { top: auto; bottom: 16px; max-height: 34vh; }
    #agent { bottom: auto; top: 150px; max-height: 40vh; z-index: 2; }
    #legend { display: none; }
  }
</style>
</head>
<body>
<div id="scene"></div>

<section id="hud" class="panel">
  <h1>Agents Office</h1>
  <div class="sub"><span id="status" class="live">connecting…</span> · <span id="claude"></span></div>
  <div id="totals"></div>
  <div id="legend"></div>
</section>

<div id="hint">drag to orbit · scroll to zoom · click a building</div>

<section id="approvals" class="panel">
  <header><h2 id="approvals-title">Needs your approval</h2></header>
  <div class="list" id="approvals-list"></div>
</section>

<section id="agent" class="panel" hidden>
  <header>
    <div>
      <div class="name" id="agent-name"></div>
      <div class="dept" id="agent-dept"></div>
      <div class="facts" id="agent-facts"></div>
    </div>
    <button id="close" aria-label="Close">×</button>
  </header>
  <div class="list" id="agent-tasks"></div>
</section>

<div id="ticker" class="panel"></div>

<section id="error" class="panel" hidden>
  <h2 id="error-title"></h2>
  <p id="error-text"></p>
</section>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
"use strict";

// ---------- vocabulary (mirrors officekit/dashboard.py) ----------
const STATES = {
  "working":          { css: "--working", label: "Working" },
  "waiting on human": { css: "--waiting", label: "Waiting on human", pulse: true },
  "blocked":          { css: "--blocked", label: "Blocked" },
  "queued":           { css: "--queued",  label: "Queued" },
  "idle":             { css: "--idle",    label: "Idle" },
};
const TASK_STATUS = {
  queued: "--queued", running: "--working", awaiting_approval: "--waiting", blocked: "--blocked",
  done: "--real", failed: "--danger", rejected: "--danger",
};
const WORK = { real: ["REAL", "--real"], llm: ["CLAUDE DRAFT", "--draft"], placeholder: ["NO OUTPUT", "--none"] };
const NOTE_STATUSES = new Set(["blocked", "failed", "awaiting_approval", "rejected"]);
const POLL_MS = 2000;

const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const stateOf = (s) => STATES[s] || STATES.idle;
const $ = (id) => document.getElementById(id);

function el(tag, attrs = {}, ...children) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v;
    else if (k === "style") n.style.cssText = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of children) if (c != null) n.append(c instanceof Node ? c : String(c));
  return n;
}
const pill = (text, cssVar) => el("span", { class: "pill", style: `color: var(${cssVar})` }, text);

function showError(title, text) {
  $("error-title").textContent = title;
  $("error-text").textContent = text;
  $("error").hidden = false;
}

// ---------- legend ----------
for (const [key, s] of Object.entries(STATES)) {
  $("legend").append(el("span", {}, el("i", { class: "dot" + (s.pulse ? " pulse" : ""), style: `color: var(${s.css})` }), s.label));
}

// ---------- three.js scene ----------
if (!window.THREE) {
  showError("Couldn't load Three.js", "The 3D view loads Three.js from cdn.jsdelivr.net. Check your internet connection and reload.");
  throw new Error("THREE missing");
}

const container = $("scene");
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
container.append(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05060f);
scene.fog = new THREE.FogExp2(0x05060f, 0.0085);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(48, 42, 58);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI * 0.47;
controls.minDistance = 12;
controls.maxDistance = 220;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.35;
controls.addEventListener("start", () => { controls.autoRotate = false; });

scene.add(new THREE.HemisphereLight(0x6070ff, 0x080010, 0.35));
const moon = new THREE.DirectionalLight(0x8090ff, 0.35);
moon.position.set(-30, 60, 20);
scene.add(moon);

// ground: dark plane + neon grid
const ground = new THREE.Mesh(new THREE.PlaneGeometry(1200, 1200), new THREE.MeshStandardMaterial({ color: 0x070814, roughness: 0.95 }));
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.02;
scene.add(ground);
const grid = new THREE.GridHelper(1200, 240, 0x3a2a8a, 0x15183a);
grid.material.transparent = true;
grid.material.opacity = 0.55;
scene.add(grid);

// optional bloom (degrades to plain rendering if the postprocessing scripts didn't load)
let composer = null;
if (THREE.EffectComposer && THREE.UnrealBloomPass && THREE.RenderPass) {
  composer = new THREE.EffectComposer(renderer);
  composer.addPass(new THREE.RenderPass(scene, camera));
  composer.addPass(new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.9, 0.55, 0.12));
}

// ---------- textures ----------
function windowTexture() {
  const c = document.createElement("canvas");
  c.width = 64; c.height = 128;
  const g = c.getContext("2d");
  g.fillStyle = "#000"; g.fillRect(0, 0, 64, 128);
  for (let y = 6; y < 128; y += 10) {
    for (let x = 5; x < 64; x += 12) {
      const lit = Math.random();
      g.fillStyle = lit > 0.35 ? `rgba(255,255,255,${0.45 + lit * 0.55})` : "rgba(255,255,255,0.08)";
      g.fillRect(x, y, 7, 5);
    }
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.magFilter = THREE.NearestFilter;
  return t;
}

function labelSprite(text, { color = "#e6e8ff", size = 46, weight = 700, glow = "rgba(124,140,255,0.9)", unit = 0.03 } = {}) {
  const pad = 24;
  const c = document.createElement("canvas");
  const g = c.getContext("2d");
  const font = `${weight} ${size}px "Space Grotesk", system-ui, sans-serif`;
  g.font = font;
  const w = Math.ceil(g.measureText(text).width) + pad * 2;
  const h = size + pad * 2;
  c.width = w; c.height = h;
  g.font = font;
  g.textBaseline = "middle";
  g.shadowColor = glow; g.shadowBlur = 18;
  g.fillStyle = color;
  g.fillText(text, pad, h / 2);
  const tex = new THREE.CanvasTexture(c);
  tex.encoding = THREE.sRGBEncoding;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
  s.scale.set(w * unit, h * unit, 1);   // world units per canvas pixel
  s.renderOrder = 10;
  return s;
}

// stable neon hue per department id, so new departments get their own color automatically
function deptHue(id) {
  let h = 0;
  for (const ch of id) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return (h % 360) / 360;
}

// ---------- city layout ----------
const city = new THREE.Group();
scene.add(city);
let buildings = new Map();     // "dept/agent" -> { mesh, edges, beacon, label, agent, dept, height }
let pickables = [];
let signature = "";
let selectedKey = null;
let framed = false;
const selector = new THREE.Mesh(new THREE.RingGeometry(2.9, 3.3, 48), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9, side: THREE.DoubleSide }));
selector.rotation.x = -Math.PI / 2;
selector.visible = false;
scene.add(selector);

const BW = 3.2, GAP = 3.2, PLATE_PAD = 3.5;

function clearCity() {
  city.traverse((o) => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) {
      if (o.material.map) o.material.map.dispose();
      if (o.material.emissiveMap) o.material.emissiveMap.dispose();
      o.material.dispose();
    }
  });
  city.clear();
  buildings = new Map();
  pickables = [];
}

function buildCity(snap) {
  clearCity();
  const depts = snap.departments || [];
  const n = Math.max(depts.length, 1);
  const cols = Math.ceil(Math.sqrt(n));
  const sizes = depts.map((d) => {
    const ac = Math.max(Math.ceil(Math.sqrt(Math.max(d.agents.length, 1))), 1);
    return ac * BW + (ac - 1) * GAP + PLATE_PAD * 2;
  });
  const cell = Math.max(16, ...sizes) + 8;
  const rows = Math.ceil(n / cols);

  depts.forEach((d, i) => {
    const cx = (i % cols - (cols - 1) / 2) * cell;
    const cz = (Math.floor(i / cols) - (rows - 1) / 2) * cell;
    const size = sizes[i];
    const hue = deptHue(d.id);
    const neon = new THREE.Color().setHSL(hue, 0.95, 0.6);

    const district = new THREE.Group();
    district.position.set(cx, 0, cz);
    city.add(district);

    const plate = new THREE.Mesh(new THREE.BoxGeometry(size, 0.4, size),
      new THREE.MeshStandardMaterial({ color: 0x0b0d22, roughness: 0.6, metalness: 0.3, emissive: neon, emissiveIntensity: 0.04 }));
    plate.position.y = 0.2;
    district.add(plate);
    const rim = new THREE.LineSegments(new THREE.EdgesGeometry(plate.geometry), new THREE.LineBasicMaterial({ color: neon }));
    rim.position.copy(plate.position);
    district.add(rim);

    const label = labelSprite(d.name.toUpperCase(), { color: "#" + neon.getHexString(), size: 40, glow: "#" + neon.getHexString() });
    label.position.set(0, 1.6, size / 2 + 1.6);
    district.add(label);

    const ac = Math.max(Math.ceil(Math.sqrt(Math.max(d.agents.length, 1))), 1);
    d.agents.forEach((a, j) => {
      const r = Math.floor(j / ac), c = j % ac;
      const span = ac * BW + (ac - 1) * GAP;
      const x = -span / 2 + BW / 2 + c * (BW + GAP);
      const z = -span / 2 + BW / 2 + r * (BW + GAP);

      const tex = windowTexture();
      const mat = new THREE.MeshStandardMaterial({ color: 0x0a0b18, roughness: 0.35, metalness: 0.6, emissive: 0xffffff, emissiveMap: tex, emissiveIntensity: 0.8 });
      const geo = new THREE.BoxGeometry(BW, 1, BW);
      geo.translate(0, 0.5, 0);
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x, 0.4, z);
      const key = d.id + "/" + a.id;
      mesh.userData.key = key;
      district.add(mesh);
      pickables.push(mesh);

      const edges = new THREE.LineSegments(new THREE.EdgesGeometry(geo), new THREE.LineBasicMaterial({ color: 0xffffff }));
      mesh.add(edges);

      const beacon = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 1.4, 16), new THREE.MeshBasicMaterial({ color: 0xffffff }));
      beacon.position.set(x, 0, z);
      district.add(beacon);

      const name = labelSprite(a.name, { size: 34, weight: 500, unit: 0.024 });
      name.position.set(x, 0, z);
      district.add(name);

      buildings.set(key, { mesh, edges, beacon, label: name, tex, deptId: d.id, agentId: a.id, height: 3, target: 3, world: district.position.clone().add(new THREE.Vector3(x, 0, z)) });
    });
  });
  frameCity(cell, cols, rows);
}

function frameCity(cell, cols, rows) {
  const extent = Math.max(cols, rows) * cell;
  const d = Math.max(34, extent * 0.72);
  if (!framed) { camera.position.set(d * 0.8, d * 0.7, d); controls.target.set(0, 2, 0); framed = true; }
}

function tasksFor(snap, deptId, agentId) {
  const d = (snap.departments || []).find((x) => x.id === deptId);
  return d ? d.tasks.filter((t) => t.agent === agentId) : [];
}

function updateCity(snap) {
  for (const d of snap.departments || []) {
    for (const a of d.agents) {
      const b = buildings.get(d.id + "/" + a.id);
      if (!b) continue;
      const mine = tasksFor(snap, d.id, a.id);
      b.state = a.state;
      b.target = 3 + Math.min(mine.length, 24) * 0.9;
      const color = new THREE.Color(css(stateOf(a.state).css));
      b.color = color;
      b.mesh.material.emissive.copy(color);
      b.edges.material.color.copy(color);
      b.beacon.material.color.copy(color);
    }
  }
}

// ---------- panels ----------
let snap = null;

function renderHud(s) {
  $("claude").textContent = s.claude_connected ? `Claude connected (${s.model})` : "Claude not connected";
  const t = s.totals || {};
  const tot = $("totals");
  tot.replaceChildren(
    el("span", {}, el("b", {}, t.tasks ?? 0), " tasks"),
    el("span", { style: "color: var(--real)" }, el("b", {}, t.real_work ?? 0), " real"),
    el("span", { style: "color: var(--draft)" }, el("b", {}, t.claude_drafts ?? 0), " drafts"),
    el("span", { style: "color: var(--none)" }, el("b", {}, t.no_output ?? 0), " no output"),
    el("span", {}, el("b", {}, t.artifacts ?? 0), " files"),
  );
}

function commandRow(text) {
  const btn = el("button", { type: "button" }, "copy");
  btn.addEventListener("click", async (e) => {
    e.stopPropagation();
    try { await navigator.clipboard.writeText(text); btn.textContent = "copied"; }
    catch { btn.textContent = "select"; }
    setTimeout(() => (btn.textContent = "copy"), 1200);
  });
  return el("div", { class: "cmd" }, el("code", {}, text), btn);
}

function approveCommands(taskId) {
  return [commandRow(`python office.py approve ${taskId}`), commandRow(`python office.py reject ${taskId} --note "..."`)];
}

function renderApprovals(s) {
  const items = s.approvals || [];
  $("approvals-title").textContent = `Needs your approval (${items.length})`;
  const list = $("approvals-list");
  if (!items.length) { list.replaceChildren(el("div", { class: "empty" }, "Nothing waiting.")); return; }
  list.replaceChildren(...items.map((a) => {
    const card = el("div", { class: "card clickable", title: "Show this agent" },
      el("div", { class: "row" }, el("span", { class: "id" }, a.task_id), pill("WAITING", "--waiting")),
      el("div", { class: "title" }, a.title),
      el("div", { class: "meta" }, `${a.department} / ${a.agent} · requested ${(a.requested || "").replace("T", " ")}`),
      a.summary ? el("div", { class: "summary" }, a.summary) : null,
      (a.artifacts || []).length ? el("ul", { class: "files" }, ...a.artifacts.map((f) => el("li", {}, "· workspace/" + f))) : null,
      ...approveCommands(a.task_id),
    );
    card.addEventListener("click", () => select(a.department + "/" + a.agent, true));
    return card;
  }));
}

function renderAgent(s) {
  if (!selectedKey) { $("agent").hidden = true; selector.visible = false; return; }
  const [deptId, agentId] = selectedKey.split("/");
  const d = (s.departments || []).find((x) => x.id === deptId);
  const a = d && d.agents.find((x) => x.id === agentId);
  if (!a) { selectedKey = null; renderAgent(s); return; }
  const st = stateOf(a.state);
  $("agent-name").textContent = a.name;
  $("agent-dept").textContent = d.name;
  $("agent-facts").replaceChildren(
    pill(st.label.toUpperCase(), st.css), el("span", {}, a.mode), el("span", {}, `${a.done} done`));
  const pending = new Set((s.approvals || []).map((x) => x.task_id));
  const tasks = tasksFor(s, deptId, agentId);
  const list = $("agent-tasks");
  if (!tasks.length) list.replaceChildren(el("div", { class: "empty" }, "No tasks yet."));
  else list.replaceChildren(...tasks.map((t) => {
    const [wl, wc] = WORK[t.work_type] || WORK.placeholder;
    return el("div", { class: "card" },
      el("div", { class: "row" }, el("span", { class: "id" }, t.id), pill(t.status.replace("_", " ").toUpperCase(), TASK_STATUS[t.status] || "--none"), pill(wl, wc)),
      el("div", { class: "title" }, t.title),
      el("div", { class: "meta" }, `updated ${(t.updated || "").replace("T", " ")} · ${(t.artifacts || []).length} file(s)`),
      t.note && NOTE_STATUSES.has(t.status) ? el("div", { class: "note" }, t.note) : null,
      ...(pending.has(t.id) ? approveCommands(t.id) : []),
    );
  }));
  $("agent").hidden = false;
}

function renderTicker(s) {
  const last = (s.activity || []).slice(-1)[0];
  $("ticker").replaceChildren(last ? el("span", {}, el("b", {}, last.at.slice(11) + "  " + last.agent), "  " + last.msg) : "No activity yet.");
}

function select(key, fly = false) {
  selectedKey = key;
  const b = buildings.get(key);
  if (b) {
    selector.visible = true;
    selector.position.set(b.world.x, 0.45, b.world.z);
    if (fly) { controls.autoRotate = false; flyTo = b.world.clone(); }
  }
  if (snap) renderAgent(snap);
}
$("close").addEventListener("click", () => { selectedKey = null; renderAgent(snap); });

// ---------- picking (click without dragging) ----------
const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let downAt = null;
renderer.domElement.addEventListener("pointerdown", (e) => { downAt = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener("pointerup", (e) => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 5) return;
  ndc.set((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(pickables, false)[0];
  if (hit) select(hit.object.userData.key);
  else { selectedKey = null; renderAgent(snap); }
});
renderer.domElement.addEventListener("pointermove", (e) => {
  ndc.set((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  renderer.domElement.style.cursor = ray.intersectObjects(pickables, false).length ? "pointer" : "";
});

// ---------- polling ----------
let failures = 0;
async function poll() {
  try {
    const r = await fetch("dashboard.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const s = await r.json();
    if (!s.departments) throw new Error("snapshot has no departments yet");
    failures = 0;
    snap = s;
    $("error").hidden = true;
    const sig = s.departments.map((d) => d.id + ":" + d.name + "[" + d.agents.map((a) => a.id + ":" + a.name).join(",") + "]").join("|");
    if (sig !== signature) { signature = sig; buildCity(s); if (selectedKey) select(selectedKey); }
    updateCity(s);
    renderHud(s);
    renderApprovals(s);
    renderAgent(s);
    renderTicker(s);
    $("status").textContent = "live · " + (s.generated || "").slice(11);
    $("status").className = "live";
  } catch (err) {
    failures += 1;
    $("status").textContent = "connection lost";
    $("status").className = "stale";
    if (failures >= 2) showError("Lost connection to the office", "Is `python office.py city` still running? The view will reconnect on its own.");
  } finally {
    setTimeout(poll, POLL_MS);
  }
}
poll();

// ---------- animation ----------
let flyTo = null;
const clock = new THREE.Clock();
function tick() {
  const t = clock.getElapsedTime();
  for (const b of buildings.values()) {
    b.height += (b.target - b.height) * 0.08;
    b.mesh.scale.y = b.height;
    b.tex.repeat.set(1, Math.max(1, Math.round(b.height / 3)));
    b.beacon.position.y = 0.4 + b.height + 0.7;
    b.label.position.y = 0.4 + b.height + 2.4;
    const st = stateOf(b.state);
    let glow = b.state === "idle" ? 0.35 : 0.9;
    if (st.pulse) glow = 0.35 + 0.95 * (0.5 + 0.5 * Math.sin(t * 4.2));
    if (b.state === "working") glow = 0.8 + 0.25 * Math.sin(t * 9);
    b.mesh.material.emissiveIntensity = glow;
    b.beacon.scale.setScalar(st.pulse ? 1 + 0.35 * (0.5 + 0.5 * Math.sin(t * 4.2)) : 1);
    b.beacon.visible = b.state !== "idle";
  }
  if (selector.visible) { selector.rotation.z = t * 0.8; selector.material.opacity = 0.55 + 0.35 * Math.sin(t * 3); }
  if (flyTo) {
    controls.target.lerp(new THREE.Vector3(flyTo.x, 4, flyTo.z), 0.08);
    if (controls.target.distanceTo(new THREE.Vector3(flyTo.x, 4, flyTo.z)) < 0.2) flyTo = null;
  }
  controls.update();
  composer ? composer.render() : renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  if (composer) composer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
